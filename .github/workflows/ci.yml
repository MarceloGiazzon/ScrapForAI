name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # npm test runs no browser (it globs *.test.ts, not the *.smoke.ts suites), so skip the
      # ~150 MB Chromium download the playwright package would otherwise fetch on install.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads EVERY commit, not only the last one: a secret deleted in a later commit is still published.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The local hooks (.githooks) stop a secret before it leaves the machine; this catches a push that skipped them
      # (--no-verify, a clone without npm install). It has no vault here, so it checks names and shapes, not known values.
      # If this fails the secret is ALREADY public: rotate it first.
      - name: Secret scan (whole history)
        run: npx tsx scripts/secret-scan.ts --history --all

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
