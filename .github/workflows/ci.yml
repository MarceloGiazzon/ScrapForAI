name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # npm test runs no browser (it globs *.test.ts, not the *.smoke.ts suites), so skip the
      # ~150 MB Chromium download the playwright package would otherwise fetch on install.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      # v4 targets Node 20, which GitHub is retiring from runners; v7 runs on Node 24. We use neither pull_request_target nor workflow_run,
      # the only thing checkout v7 changed behaviour for.
      - uses: actions/checkout@v7
        with:
          # The secret scan reads EVERY commit, not only the last one: a secret deleted in a later commit is still published.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The local hooks (.githooks) stop a secret before it leaves the machine; this catches a push that skipped them
      # (--no-verify, a clone without npm install). It has no vault here, so it checks names and shapes, not known values.
      # If this fails the secret is ALREADY public: rotate it first.
      - name: Secret scan (whole history)
        run: npx tsx scripts/secret-scan.ts --history --all

      - name: Typecheck
        run: npm run typecheck

      # There is no .env here, on purpose: the tests must pass on the defaults a new user gets. The config refuses to load
      # without these two, so give it values that are obviously not secrets and reach nothing.
      - name: Test
        env:
          SCRAPFORAI_API_KEY: test-ci-not-a-secret-key-0001
          ALLOWED_TARGET_ORIGINS: http://127.0.0.1:4999
        run: npm test
